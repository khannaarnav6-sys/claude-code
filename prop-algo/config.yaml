# Apex $50K evaluation rules (parameterized; other sizes can be added)
account:
  name: apex50k
  start_balance: 50000.0
  profit_target: 3000.0        # pass at balance >= 53,000 (realized, while flat)
  trailing_drawdown: 2500.0    # trails REAL-TIME equity high-water mark (incl. unrealized peaks)
  max_contracts: 10
  min_trading_days: 7          # Apex promos often waive to 1 -- override with --min-days
  eval_fee: 35.0               # monthly fee per attempt (promo pricing)

# Instruments: dukascopy = multi-year backtest proxy, yahoo = live/recent true futures
instruments:
  NQ:
    dukascopy: E_NQ-100
    yahoo: NQ=F
    point_value: 20.0
    tick_size: 0.25
  ES:
    dukascopy: E_SandP-500
    yahoo: ES=F
    point_value: 50.0
    tick_size: 0.25
  YM:
    dukascopy: E_D&J-Ind
    yahoo: YM=F
    point_value: 5.0
    tick_size: 1.0
  RTY:
    dukascopy: USSC2000.IDX/USD
    yahoo: RTY=F
    point_value: 50.0
    tick_size: 0.1

costs:
  commission_rt: 4.0           # $ round-trip per contract
  slippage_ticks: 1            # per side

strategies:
  orb:
    enabled: true
    or_minutes: 30             # opening range = first 30 min (two 15m bars) from 9:30 ET
    min_volume_ratio: 1.0      # breakout bar volume vs 20-bar average for A+ grade
    target_r: 2.0              # scale target in R multiples
    max_or_atr: 1.5            # skip if opening range wider than 1.5x ATR(14d)
    shorts: veto               # breakdowns aren't traded (PF 0.94 on long-biased
                               # indices) but block other entries while the
                               # phantom short would be open -- worth +4.5pp P(pass)
  momentum:
    enabled: true
    gap_atr: 0.50              # overnight gap must exceed 0.5x daily ATR; the
                               # 0.35-0.60 scan is a smooth plateau (34-37% pass),
                               # so this is a stable choice, not a fitted spike
    vwap_hold_bars: 3          # bars price must hold the gap side of VWAP
    target_r: 2.5

sizing:
  # Attempts and speed trade off directly: risking less busts less but takes
  # months. Numbers from the 2023-2026 Monte Carlo (uncapped attempts):
  #   sprint   25.0% risk -> E[attempts] 2.7, median pass ~14 td, ~$105 fees
  #   balanced 12.0% risk -> E[attempts] 1.6, median pass ~53 td, ~$182 fees
  #   grind     8.5% risk -> E[attempts] 1.3, median pass ~98 td, ~$262 fees
  profiles:
    sprint: 0.25
    balanced: 0.12
    grind: 0.085
  profile: grind               # default; override per-run with --profile/--risk
  aplus_multiplier: 1.5        # A+ signals risk 1.5x the budget
  taper: true                  # near the target, risk only what's left to gain

live:
  instruments: [NQ, ES]
  poll_interval_min: 15
  webhook_env: DISCORD_WEBHOOK_URL
  state_file: live_state.json
